    .tab.on { color: #E0A045; border-bottom-color: #E0A045; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #453E36; color: #AFA393; font-size: 13px; font-weight: 700; }
    .chip.on { background: rgba(224,160,69,0.14); border-color: #E0A045; color: #F4BF63; }
    .seg { display: flex; padding: 3px; background: #1D1A17; border: 1px solid #2F2A25; border-radius: 8px; }
    .seg > div { flex: 1; text-align: center; padding: 12px 0; border-radius: 6px; font-size: 13px; font-weight: 700; color: #AFA393; }
    .seg > div.on { background: #282420; color: #EFE7D8; box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset; }
    .toggle { width: 44px; height: 26px; border-radius: 13px; background: #282420; border: 1px solid #453E36; position: relative; flex: none; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #AFA393; }
    .toggle.on { background: #E0A045; border-color: #E0A045; }
    .toggle.on::after { left: 21px; background: #1A1308; }
    .medal { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; }
    .medal.on { background: rgba(224,160,69,0.14); border: 1px solid rgba(224,160,69,0.45); color: #F4BF63; }
    .medal.off { background: #1D1A17; border: 1px solid #2F2A25; color: #756B5E; }
    .glow { background: radial-gradient(60% 50% at 50% 35%, rgba(224,160,69,0.22), transparent 70%); }
    .rarity { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .rarity i { display: block; width: 7px; height: 7px; transform: rotate(45deg); }
    .divider { height: 1px; background: #2F2A25; }
</style>
</helmet>
