# App icon: design "App-Symbol" variant C "Herdfeuer" (horse from the bar logo,
# mane as flame). Sources in assets/branding; regenerate with
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  min_sdk_android: 21
  adaptive_icon_background: assets/branding/app_icon_background.png
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
